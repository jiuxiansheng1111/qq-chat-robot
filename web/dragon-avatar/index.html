<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龙女仆 · 小小直播间</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="mark">龍</div><div><small>DRAGON MAID / LIVE 2D</small><h1>今天，也元气登场</h1></div><span id="connection" class="status">连接中</span></header>
<main><section class="stage"><div class="stage-top"><span>龙女仆</span><span class="tag">实时预览</span></div><iframe id="preview" src="/avatar?muted=1" title="龙女仆实时预览" allow="autoplay"></iframe><div class="stage-bottom"><span>白色龙角 · 一点点紫 · 一碗大白饭</span><button id="background" class="quiet">切换背景</button></div></section>
<aside><section class="card"><div class="card-title"><h2>今天什么心情？</h2><small>快捷键 1–8</small></div><div id="expressions" class="expressions"></div><button id="nod" class="quiet wide">点点头 <span>空格</span></button></section>
<section class="card"><h2>自然动起来</h2><label>呼吸与摆动 <output id="motionValue">65%</output><input id="motion" type="range" min="0" max="100" value="65"></label><label>画面大小 <output id="zoomValue">100%</output><input id="zoom" type="range" min="60" max="170" value="100"></label></section>
<section class="card"><div class="card-title"><h2>开口说话</h2><span id="voiceState" class="hint">待机</span></div><div class="mic-row"><button id="mic" class="quiet">启用麦克风口型</button><div class="meter"><div id="level"></div></div></div><small class="hint">只读取音量驱动口型，不录音、不上传麦克风音频</small><textarea id="speech" maxlength="240" placeholder="写一句话，让龙女仆用已有音色说出来…">我是龙女仆，今天也请多关照。先吃一口大白饭，再来认真干活</textarea><div class="actions"><button id="speak" class="primary">说给你听</button><button id="demo" class="quiet">示例语音</button><button id="stop" class="quiet">停止</button></div><label class="check"><input type="checkbox" id="monitor">本页试听 <small>OBS 收音时关闭，避免双重声音</small></label><p id="message" role="status">点选表情即可同步到 OBS 画面</p></section>
<section class="card source"><h2>放进直播间</h2><p>OBS 添加「浏览器」来源，画布 1920 × 1080，帧率 60</p><code>http://127.0.0.1:6187/avatar</code><button id="copy" class="quiet">复制透明画面地址</button><small>这是自定义 2D 动态皮套，可直接作为 OBS 画面；不是 Cubism / VTube Studio 模型文件</small></section></aside></main><footer>当前只运行本机画面 · 不会自动开播</footer><script type="module" src="/static/control.js"></script></body></html>
