name: Ultraman image audit

on:
  push:
    branches: [main]
    paths:
      - "app/services/ultraman.py"
      - "app/services/ultraman_encyclopedia.py"
      - "scripts/audit_ultraman_images.py"
      - ".github/workflows/ultraman-image-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Audit every independent Ultraman form image
        run: python scripts/audit_ultraman_images.py --report ultraman-image-audit.json --concurrency 3
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultraman-image-audit
          path: ultraman-image-audit.json
