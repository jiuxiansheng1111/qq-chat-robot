name: Android phone
on:
  push:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  phone:
    name: Android ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build app and on-device tests
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          python mobile/android/build.py --output data/mobile-build/ci.apk
          python mobile/android/build.py --test --output data/mobile-build/tests.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check live search, chats, screen-off and restart on Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python mobile/android/verify_device.py
