name: qqchat robot CI

on:
  push:
  pull_request:

jobs:
  plugin-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check downloadable plugins against source
        run: python scripts/package_plugins.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chinese fonts and the matching Chromium for image tests
        run: |
          python -m playwright install --with-deps --no-shell chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          # The report renderer finds the chromium executable on PATH.
          mkdir -p "$RUNNER_TEMP/report-browser"
          python - "$RUNNER_TEMP/report-browser/chromium" <<'PY'
          import sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path).resolve(strict=True)
          Path(sys.argv[1]).symlink_to(executable)
          PY
          echo "$RUNNER_TEMP/report-browser" >> "$GITHUB_PATH"
      - name: Run tests
        run: python -m pytest -q -rs
      - name: Run lint
        run: python -m ruff check app tests
